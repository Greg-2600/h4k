id: h4k-struts-rce
info:
  name: Apache Struts RCE (CVE-2017-5638)
  author: h4k
  severity: critical
  description: Struts Jakarta OGNL injection probe (offline bundle template).
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2017-5638
  metadata:
    cve: CVE-2017-5638
    cwe: CWE-20
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    headers:
      Content-Type: "%{(#_='multipart/form-data')}"
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
        condition: or
