<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>h4k — Metasploit Recon &amp; Advisory</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>h4k</h1>
    <p class="tagline">Recon &amp; vulnerability advisory for authorized lab targets</p>
  </header>

  <main>
    <section class="panel">
      <form id="scan-form">
        <div class="row">
          <label for="target">Target (IP or domain)</label>
          <input id="target" name="target" placeholder="192.168.1.248" required />
        </div>

        <div class="row">
          <label>Mode</label>
          <div class="mode-select" id="mode-select">
            <label class="mode-opt">
              <input type="radio" name="mode" value="stealth" />
              <span class="mode-name">Stealth</span>
              <span class="mode-desc">Slow, non-invasive probes</span>
            </label>
            <label class="mode-opt">
              <input type="radio" name="mode" value="tor" />
              <span class="mode-name">Tor</span>
              <span class="mode-desc">Route everything through Tor</span>
            </label>
            <label class="mode-opt">
              <input type="radio" name="mode" value="overt" checked />
              <span class="mode-name">Overt</span>
              <span class="mode-desc">Fast, full scan</span>
            </label>
          </div>
        </div>

        <div class="row actions">
          <button type="submit" id="scan-btn">Start Scan</button>
        </div>
      </form>
    </section>

    <section class="panel" id="status-panel" hidden>
      <h2 id="status-title">Job status</h2>
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="status-msg" id="status-msg"></p>
    </section>

    <section class="panel" id="report-panel" hidden>
      <h2>Report</h2>
      <p class="meta" id="report-meta"></p>

      <div class="tabs">
        <button class="tab active" data-tab="hosts">Hosts</button>
        <button class="tab" data-tab="vulns">Vulnerabilities</button>
        <button class="tab" data-tab="recs">Recommendations</button>
        <button class="tab" data-tab="notes">Notes</button>
      </div>

      <div id="tab-hosts" class="tab-panel active"></div>
      <div id="tab-vulns" class="tab-panel"></div>
      <div id="tab-recs" class="tab-panel"></div>
      <div id="tab-notes" class="tab-panel"></div>
    </section>

    <section class="legal">
      <strong>Authorization required.</strong> Use this tool only against systems
      you own or have written authorization to test (e.g. school lab range, your own VMs).
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
