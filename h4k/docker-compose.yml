services:
  h4k:
    build: .
    image: h4k:latest
    network_mode: host
    environment:
      MSF_HOST: 127.0.0.1
      MSF_PORT: "55553"
      MSF_PASSWORD: h4k_msf_rocks
      TOR_PORT: "9050"
      API_PORT: "3137"
    restart: unless-stopped

  # lab-only intentionally-vulnerable fuzzing target (teaches 0-day discovery)
  vulnlab:
    build: ../vulnlab
    image: vulnlab:latest
    network_mode: host
    environment:
      VULNLAB_PORT: "8080"
    restart: unless-stopped
