services:
  h4k:
    container_name: h4k_h4k
    build: .
    image: h4k:latest
    network_mode: host
    environment:
      MSF_HOST: 127.0.0.1
      MSF_PORT: "55553"
      MSF_PASSWORD: h4k_msf_rocks
      TOR_PORT: "9050"
      API_PORT: "3137"
      # AI triage: any OpenAI-compatible gateway. Example (opencode/free-model
      # gateway of your choice):
      #   H4K_AI_PROVIDER: openai_compatible
      #   H4K_AI_URL: https://<gateway>/v1/chat/completions
      #   H4K_AI_KEY: <key>
      #   H4K_AI_MODEL: <model-id>
      H4K_AI_PROVIDER: ${H4K_AI_PROVIDER:-}
      H4K_AI_URL: ${H4K_AI_URL:-}
      H4K_AI_KEY: ${H4K_AI_KEY:-}
      H4K_AI_MODEL: ${H4K_AI_MODEL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3137/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  vulnlab:
    container_name: h4k_vulnlab
    build: ../vulnlab
    image: vulnlab:latest
    network_mode: host
    environment:
      VULNLAB_PORT: "3138"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=3 http://127.0.0.1:3138/ | grep -q vulnlab || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
