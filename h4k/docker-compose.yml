services:
  h4k:
    build: .
    image: h4k:latest
    network_mode: host
    environment:
      MSF_HOST: 127.0.0.1
      MSF_PORT: "55553"
      MSF_PASSWORD: h4k_msf_rocks
      TOR_PORT: "9050"
      API_PORT: "3137"
      # Local LLM (root-cause/patch assist). Point at the host/sidecar Ollama.
      H4K_AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      H4K_AI_MODEL: qwen2.5:latest
    restart: unless-stopped

  # lab-only intentionally-vulnerable fuzzing target (teaches 0-day discovery)
  vulnlab:
    build: ../vulnlab
    image: vulnlab:latest
    network_mode: host
    environment:
      VULNLAB_PORT: "8080"
    restart: unless-stopped

  # optional local LLM sidecar. Runs Ollama on a NON-standard host port so it
  # doesn't collide with a host daemon. To use it, point h4k's OLLAMA_BASE_URL
  # at http://127.0.0.1:11435 (or the compose service hostname on a custom net).
  ollama-sidecar:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    command: serve
    restart: unless-stopped
    profiles: ["llm"]  # start with: docker compose --profile llm up

volumes:
  ollama-data:
