name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Create venv + install toolchain
        run: make setup

      - name: Lint every language (Python, shell, Docker, YAML, workflow, Markdown, JS)
        run: make lint

      - name: Test + coverage gate (90 percent floor)
        run: make coverage

      - name: Publish coverage to the job summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo '```text'
            if [ -f .coverage ]; then
              .venv/bin/coverage report --rcfile=pyproject.toml
            else
              echo "Coverage data was not produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  e2e:
    # Selenium browser suite. Runs the real API in sandbox mode against
    # headless Chrome -- no network, no Metasploit daemon, no real targets.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Chrome + chromedriver
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable

      - name: Create venv + install toolchain
        run: |
          make setup
          .venv/bin/pip install selenium

      - name: Selenium end-to-end suite
        env:
          H4K_CHROME_BINARY: /usr/bin/google-chrome
          H4K_CHROMEDRIVER: /usr/bin/chromedriver
        run: make e2e
