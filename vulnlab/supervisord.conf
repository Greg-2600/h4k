; supervisord config for vulnlab.
; Runs the intentionally-vulnerable server and restarts it after the fuzzer
; crashes it, so the h4k fuzzer can observe "service down then back up".
[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:vulnlab]
command=/usr/local/bin/vulnlab %(ENV_VULNLAB_PORT)s
autostart=true
autorestart=true
startretries=9999
stderr_logfile=/dev/fd/1
stdout_logfile=/dev/fd/1
